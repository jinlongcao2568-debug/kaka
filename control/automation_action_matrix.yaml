version: 1
id: automation_action_matrix
owner_docs:
  - D1
  - 自动化开发动作门禁表
developer_entry_docs:
  - START_HERE.md
  - DEV_MODE.md
  - MINIMAL_PRODUCT_PATH.md
notes:
  - external-facing changes are controlled-opening targets, not permanent development exclusions
  - payment/delivery/outreach/refund/high-restriction flows may be developed and tested in sandbox, mock, dry-run, regression, or explicitly authorized pilot contexts
  - production live use requires concrete target authorization, manual approval where applicable, audit, operator action, release/checklist gates, rollback/reconciliation, and stop conditions
  - automated refund execution is not permanently blocked; production automatic refund requires explicit pilot or manual approval authority plus audit, reconciliation, rollback/suspension, and operator action
  - ordinary direct-dev is allowed for internal code, tests, scripts, docs, and consistency sync when the change does not enter live/release/approval-audit/schema-migration/cross-stage high-risk domains
  - challenge/OCR/login-state/captcha-classification/browser-compatibility/cookie/proxy-rate-limit-governance/audited-public-interface-discovery capabilities may be developed and tested for owned, sandbox, explicitly authorized, regression, or security-exercise contexts; real third-party live use still requires authorization, source policy, audit, operator action, and controlled-opening gates
execution_mode_summary:
  DEV_MODE: ordinary local development; direct edit and relevant tests are the default
  TEST_MODE: sandbox/mock/dry-run/regression/authorized pilot; do not claim production live success
  PROD_LIVE_MODE: real external/customer/money/delivery/refund/release effects; requires authorization, approval, audit, operator action, and rollback/reconciliation when relevant
review_gate_matrix: control/review_gate_matrix.yaml
task_packet_source: control/current_task.yaml#currentTask.task_packet
action_classes:
  - id: DIRECT_EDIT
    allow: direct_edit
    description: low-risk direct-dev updates across docs, control, code, tests, scripts, or local machine assets
  - id: DRAFT_ONLY
    allow: draft_only
    description: medium-risk changes require manual review
  - id: MANUAL_APPROVAL_REQUIRED
    allow: manual_approval
    description: high-risk changes must be approved before continue
  - id: BLOCKED
    allow: blocked
    description: forbidden for automation
change_class_to_action_class:
  LOW_RISK_DIRECT: DIRECT_EDIT
  DRAFT_WITH_REVIEW: DRAFT_ONLY
  MANDATORY_HUMAN_REVIEW: MANUAL_APPROVAL_REQUIRED
  STOP_AND_ESCALATE: BLOCKED
actions:
  - action_id: DOC_SYNC
    scope: docs/D1-D14 and docs/自动化开发动作门禁表.md
    action_class: DIRECT_EDIT
    notes: may update正文 or supplements when aligning with AGENTS, human current instructions, or code facts; do not create a second formal semantics source
  - action_id: CONTROL_UPDATE
    scope: control/current_task.yaml, control/repo_status.md, control/automation_*.yaml
    action_class: DIRECT_EDIT
  - action_id: MACHINE_ASSET_UPDATE
    scope: contracts/**, handoff/**, testing/**, governance/**
    action_class: DIRECT_EDIT
    notes: ordinary consistency sync may use direct-dev; release, governance, approval/audit, schema/migration, or live semantics still escalate through review_gate_matrix
  - action_id: SCRIPT_CHANGE
    scope: scripts/**
    action_class: DIRECT_EDIT
    notes: ordinary script fixes may use direct-dev; release/readiness/gate scripts still escalate through review_gate_matrix
  - action_id: CODE_CHANGE
    scope: src/**, tests/**, fixtures/**
    action_class: DIRECT_EDIT
    notes: ordinary internal code/test fixes may use direct-dev; live, release, schema/migration, or Stage8/9 high-risk execution still escalate through review_gate_matrix
  - action_id: EXTERNAL_RELEASE
    scope: external release, external delivery, external integrations
    action_class: MANUAL_APPROVAL_REQUIRED
  - action_id: OUTREACH_EXECUTION
    scope: stage8 outreach real sending
    action_class: MANUAL_APPROVAL_REQUIRED
  - action_id: PAYMENT_DELIVERY_EXECUTION
    scope: stage9 payment/delivery execution
    action_class: MANUAL_APPROVAL_REQUIRED
  - action_id: AUTOMATED_REFUND_EXECUTION
    scope: stage9 automated refund execution
    action_class: MANUAL_APPROVAL_REQUIRED
    notes: sandbox/mock/dry-run is allowed for testing; production automatic refund requires explicit authorization, audit, reconciliation, rollback/suspension, and operator action
  - action_id: HIGH_RESTRICTION_FIELDS
    scope: natural person high restriction or governed supplement externalization
    action_class: MANUAL_APPROVAL_REQUIRED
    notes: masked/simulated approval-flow tests are allowed; real external release requires manual approval chain
enforcement_rules:
  - rule: all formal batches must declare change_class via review_gate_matrix
  - rule: ordinary direct-dev does not require task-packet declaration unless it enters controlled-window criteria
  - rule: non-LOW_RISK_DIRECT batches must declare human_review_required=true
  - rule: STOP_AND_ESCALATE domains can never continue as direct or draft batch
  - rule: review gate classification is path/domain based; free-text intent cannot down-classify the batch

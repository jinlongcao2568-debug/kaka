    run-runtime-entrypoint.ps1: orchestrator
    restore-private-pilot-isolated.ps1: validation
    restore-production-release-isolated.ps1: validation
    rollback-private-pilot-release.ps1: orchestrator
    rollback-production-release.ps1: orchestrator
    invoke-local-json-test-env.ps1: validation
    clean-python-cache.ps1: utility
    cleanup-local-artifacts.ps1: utility
  prefixes:
    analyze-: diagnostic
    audit-: diagnostic
    build-: state_builder
    check-: validation
    diagnose-: diagnostic
    doctor: validation
    extract-: utility
    lint-: validation
    migrate-: migration
    parse-: utility
    plan-: planning
    qa-: diagnostic
    run-: controlled_live_runner
    trace-: diagnostic
    triage-: diagnostic
    validate-: validation

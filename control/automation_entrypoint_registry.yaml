      - technical blocker list
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Fail closed unless every technical production gate is ready; active release validation additionally checks independent approval.

  - entrypoint_id: production_release_deployer
    kind: script

      - actual delivered alert probe
      - technical readiness for separate release approval
    manual_gate_required: true
    external_customer_action_enabled: false
    replaces_human_memory: true
    limitations:
      - Does not approve or activate a customer-visible release.
      - Owner release request and distinct reviewer approval remain mandatory.
    purpose: Deploy the fail-closed production stack, prove alert delivery, and stop at READY_FOR_APPROVAL.

  - entrypoint_id: stage1_6_internal_http_orchestration_preview
    kind: http_route
    route: /internal/stage1-6/orchestrations
    entrypoint_role: orchestrator
    status: INTERNAL_PREVIEW_ONLY
    automation_layer: stage1_6_internal_preview
    module_or_command: src/api/routes/stage6.py
    state_inputs:
      - sanitized offline internal payload
      - repository-backed Stage6 preview inputs
    state_outputs:
      - internal orchestration preview result
      - blocked transport state for Stage1-5 real execution
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    limitations:
      - Does not execute real Stage1-5 transport.
      - External live transport remains disabled.
      - Payload boundary must stay SANITIZED_OFFLINE_INTERNAL.
    purpose: Provide internal preview orchestration without implying external live automation is enabled.

  - entrypoint_id: controlled_gray_dedicated_scheduler_worker
    kind: script
    script: scripts/run-controlled-gray-scheduler-worker.ps1
    entrypoint_role: orchestrator
    status: FORMAL_CURRENT
    automation_layer: controlled_gray_scheduler_worker
    module_or_command: runtime.controlled_gray_scheduler_worker
    state_inputs:
      - existing storage-backed controlled_gray_public_orchestrator worker queue
      - internal prepare-only job payload
      - optional bounded recurring interval
    state_outputs:
      - durable queue lease and heartbeat events
      - retry, suspend, dead-letter, success, cancellation, and recurrence readback
      - stage progress, execution budget, timeout category, and process heartbeat readback
      - controlled gray prepare artifacts
      - worker process status JSON
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    limitations:
      - Runs as a dedicated process; the HTTP run-once compatibility route never executes the long chain.
      - Only internal prepare-only jobs are accepted; live execution, release, payment, delivery, and refund remain disabled.
      - Core capability only; browser jobs are routed to operator_long_task_browser_worker.
    purpose: Poll the existing durable worker queue, renew leases, recover expired work after restart, apply bounded retries/dead-letter, and enqueue future recurring occurrences without running long work inside Web requests.

  - entrypoint_id: operator_long_task_browser_worker
    kind: script
    script: scripts/run-operator-long-task-worker.ps1
    entrypoint_role: orchestrator
    status: FORMAL_CURRENT
    automation_layer: operator_long_task_browser_worker
    module_or_command: runtime.operator_long_task_worker
    state_inputs:
      - storage-backed operator_long_tasks queue
      - autonomous opportunity search jobs requiring browser capability
      - allowlisted real public source capture jobs requiring browser capability
    state_outputs:
      - durable progress, heartbeat, execution budget, cancellation, retry, and terminal readback
      - repository-backed autonomous search or public source capture business readback
      - browser worker process status JSON
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    limitations:
      - Internal-only source acquisition and analysis; customer touch, release, payment, delivery, and refund remain disabled.
      - Cancellation is cooperative at declared checkpoints; a blocking third-party fetch cannot be force-killed inside its Python thread.
      - Private-pilot image build/up/health still requires an available Docker daemon.
    purpose: Keep browser-capable search and allowlisted public-source capture out of the API process while preserving durable capability routing, progress, cancellation, budgets, retries, and readback.


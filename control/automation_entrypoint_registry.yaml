      - current-release forward recovery evidence
    manual_gate_required: true
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Close customer ingress, prove the previous release starts against the current schema, and restore the current release.

  - entrypoint_id: production_release_preflight

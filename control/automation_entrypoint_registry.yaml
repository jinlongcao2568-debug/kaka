registry_id: automation-entrypoint-registry-v1
registry_version: 1
updated_at: "2026-05-23"
purpose: >
  Machine-readable registry for automation entrypoints. Scripts are treated as
  thin launchers; durable workflow decisions must live in src runners,
  contracts, handoff assets, and control state.

architecture_decision:
  scripts_are_thin_launchers: true
  scripts_are_not_the_system_brain: true
  system_brain_layers:
    - src/runtime controller, state machine, dispatcher, transition guard, and audit ledger
    - src/storage state builders and runners
    - src/api internal orchestration routes
    - contracts and handoff schemas
    - control registries and gates
  direct_dev_default_allowed: true
  live_customer_actions_require_release_gate: true
  external_touch_payment_delivery_refund_auto_execution_allowed: false
  human_memory_replacement_policy: >
    Formal workflow continuation must be discoverable from this registry and
    from generated state artifacts, not from an operator remembering which
    script to run next.

required_audit:
  script: scripts/audit-automation-entrypoints.ps1
  module_or_command: storage.automation_entrypoint_audit
  output_root: tmp/evaluation-real-samples/automation-entrypoint-audit-v1
  expected_state: PASS

allowed_entrypoint_roles:
  - orchestrator
  - controlled_live_runner
  - state_builder
  - field_query
  - readback
  - dispatch_runner
  - validation
  - diagnostic
  - migration
  - planning
  - utility

allowed_status_values:
  - FORMAL_CURRENT
  - INTERNAL_PREVIEW_ONLY
  - SUPPORTING_TOOL
  - DIAGNOSTIC_ONLY

formal_entrypoints:
  - entrypoint_id: stage1_6_real_public_pressure_runner
    kind: script
    script: scripts/run-guangzhou-stage1-6-real-public-pressure-v1.ps1
    entrypoint_role: controlled_live_runner
    status: FORMAL_CURRENT
    automation_layer: stage1_6_public_source_pressure_loop
    module_or_command: storage.real_public_stage1_6_pressure_report
    state_inputs:
      - public source candidate windows
      - analysis strategy plan outputs
      - bounded execution budget
    state_outputs:
      - Stage1-6 real public pressure run result
      - bridgeable release evidence task candidates
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Run controlled public-source Guangzhou pressure batches and emit machine-readable state.

  - entrypoint_id: stage4_release_evidence_bridge_builder
    kind: script
    script: scripts/build-stage4-release-evidence-bridge-v1.ps1
    entrypoint_role: state_builder
    status: FORMAL_CURRENT
    automation_layer: stage4_release_evidence_bridge
    module_or_command: storage.real_public_stage1_6_pressure_report
    state_inputs:
      - Stage1-6 real public pressure run result
      - Stage6 review loop policy
    state_outputs:
      - bridge plan
      - release evidence query task queue
      - review-ready report
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Convert pressure run results into reviewable release evidence bridge tasks.

  - entrypoint_id: guangdong_local_field_query_probe
    kind: script
    script: scripts/run-guangdong-local-field-query-probe-v1.ps1
    entrypoint_role: field_query
    status: FORMAL_CURRENT
    automation_layer: stage4_release_field_query
    module_or_command: storage.guangdong_local_field_query_probe
    state_inputs:
      - release evidence bridge tasks
      - project/company/person identifiers
      - source-specific query budgets
    state_outputs:
      - local public source field query results
      - matched/not_found/review_required source states
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Query Guangdong local public sources with evidence-grade matching gates.

  - entrypoint_id: guangdong_gdcic_openplatform_query_probe
    kind: script
    script: scripts/run-guangdong-gdcic-query-probe-v1.ps1
    entrypoint_role: field_query
    status: FORMAL_CURRENT
    automation_layer: stage4_gdcic_openplatform_query
    module_or_command: storage.guangdong_gdcic_query_probe
    state_inputs:
      - company identifiers
      - project identifiers and title variants
      - bounded public-source query budget
    state_outputs:
      - GDCIC openplatform readback
      - source-specific evidence candidates
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Query anonymous GDCIC openplatform sources without treating unrelated company records as project evidence.

  - entrypoint_id: stage6_review_loop_runner
    kind: script
    script: scripts/run-stage6-review-loop-v1.ps1
    entrypoint_role: orchestrator
    status: SUPPORTING_TOOL
    automation_layer: stage6_review_loop
    module_or_command: storage.stage6_review_loop_runner
    superseded_by_entrypoint_id: stage6_review_cycle_runner
    cleanup_state: retained_for_compatibility_and_sample_replay_only
    state_inputs:
      - review action dispatch
      - batch closeout
      - release field query results
      - baseline evidence state
    state_outputs:
      - Stage6 review loop manifest
      - operator projection
      - next-cycle dispatch tasks
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Compatibility runner for older Stage6 review-loop artifacts; new continuation should use stage6_review_cycle_runner or runtime_controller_entrypoint_transport.

  - entrypoint_id: stage6_review_cycle_runner
    kind: script
    script: scripts/run-stage6-review-cycle-v1.ps1
    entrypoint_role: orchestrator
    status: FORMAL_CURRENT
    automation_layer: stage6_review_cycle
    module_or_command: storage.stage6_review_cycle_runner
    state_inputs:
      - evidence batch closeout
      - runtime blocker next subqueue
      - Stage6 review loop runner artifact
      - Stage6 review loop status artifact
      - release field query results
      - release evidence adapter plan
      - original backtrace continuation
      - P13B continuation results
    state_outputs:
      - Stage6 review cycle manifest
      - runtime blocker controller queue
      - runtime blocker controller dispatch tasks
      - runtime blocker worker follow-up queue
      - operator projection status table
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Continue Stage6 controller/subqueue routing from formal or standalone machine-readable artifacts instead of manual runner chaining.

  - entrypoint_id: stage16_p13b_continuation_runner
    kind: script
    script: scripts/run-stage16-p13b-continuation-v1.ps1
    entrypoint_role: orchestrator
    status: FORMAL_CURRENT
    automation_layer: stage16_p13b_continuation
    module_or_command: storage.stage16_p13b_continuation_controller
    state_inputs:
      - P13B overlap triage state
      - original readback targets
      - bounded continuation budget
    state_outputs:
      - P13B continuation results
      - next readback task candidates
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Continue P13B overlap/readback work from persisted state and budgets.

  - entrypoint_id: runtime_controller_entrypoint_transport
    kind: script
    script: scripts/run-runtime-entrypoint.ps1
    entrypoint_role: orchestrator
    status: SUPPORTING_TOOL
    automation_layer: runtime_controller_entrypoint_transport
    module_or_command: runtime.entrypoint_cli
    state_inputs:
      - entrypoint_id
      - structured runtime payload JSON
      - optional Stage1 market scan/source blueprint payload
      - optional Stage2 capture records/readbacks
      - optional Stage3 parse records/readbacks
      - optional evidence batch closeout artifact
      - optional runtime blocker next subqueue artifact
      - optional Stage6 review loop artifact
      - optional Stage6 review loop status artifact
      - optional release field query artifact
      - optional release evidence adapter plan artifact
      - optional original backtrace continuation artifact
      - optional Stage16 P13B continuation artifact
      - optional Stage1-6 readiness table artifact
      - optional Stage1-6 gap summary artifact
      - optional Stage5 calibration sample artifact
      - optional output JSON path
    state_outputs:
      - controller-owned run state
      - internal dispatch queue
      - audit replay ledger
      - runtime_run_state repository record
      - runtime_audit_event repository records
      - runtime_operator_projection repository record
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Route generic entrypoint_id payloads, including Stage1-3 front-chain inputs, through the runtime controller instead of script-owned business flow.

  - entrypoint_id: stage1_3_repair_worker
    kind: script
    script: scripts/run-runtime-entrypoint.ps1
    entrypoint_role: dispatch_runner
    status: FORMAL_CURRENT
    automation_layer: stage1_3_repair_worker
    module_or_command: runtime.stage13_repair_worker
    state_inputs:
      - controller dispatch queue records
      - Stage1-3 repair review tasks
      - source metric counts
      - input artifact refs
    state_outputs:
      - internal Stage1-3 repair workplan
      - repair metric counts
      - worker family routing summary
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Convert controller-derived Stage1-3 repair review tasks into internal repair workplans without executing live external actions.

  - entrypoint_id: gdcic_browser_authorized_readback_builder
    kind: script
    script: scripts/build-gdcic-browser-authorized-readback-v1.ps1
    entrypoint_role: state_builder
    status: FORMAL_CURRENT
    automation_layer: stage4_gdcic_browser_authorized_readback
    module_or_command: storage.gdcic_browser_authorized_readback
    state_inputs:
      - release evidence adapter plan
      - optional authorized browser storage state
      - bounded browser readback budget
    state_outputs:
      - GDCIC browser authorized readback manifest
      - runtime worker result ledger
      - project manager change readback summary
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    purpose: Build and persist GDCIC authorized browser readback state for Stage4 release evidence without enabling customer-visible actions.

  - entrypoint_id: stage1_6_internal_http_orchestration_preview
    kind: http_route
    route: /internal/stage1-6/orchestrations
    entrypoint_role: orchestrator
    status: INTERNAL_PREVIEW_ONLY
    automation_layer: stage1_6_internal_preview
    module_or_command: src/api/routes/stage6.py
    state_inputs:
      - sanitized offline internal payload
      - repository-backed Stage6 preview inputs
    state_outputs:
      - internal orchestration preview result
      - blocked transport state for Stage1-5 real execution
    manual_gate_required: false
    external_customer_action_enabled: false
    replaces_human_memory: true
    limitations:
      - Does not execute real Stage1-5 transport.
      - External live transport remains disabled.
      - Payload boundary must stay SANITIZED_OFFLINE_INTERNAL.
    purpose: Provide internal preview orchestration without implying external live automation is enabled.

script_classification_rules:
  exact:
    run-golden.ps1: validation
    run-governance-contracts.ps1: validation
    run-storage-migrations.ps1: migration
    run-runtime-entrypoint.ps1: orchestrator
    invoke-local-json-test-env.ps1: validation
    clean-python-cache.ps1: utility
    cleanup-local-artifacts.ps1: utility
  prefixes:
    analyze-: diagnostic
    audit-: diagnostic
    build-: state_builder
    check-: validation
    diagnose-: diagnostic
    doctor: validation
    extract-: utility
    lint-: validation
    migrate-: migration
    parse-: utility
    plan-: planning
    qa-: diagnostic
    run-: controlled_live_runner
    trace-: diagnostic
    triage-: diagnostic
    validate-: validation

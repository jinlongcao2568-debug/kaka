name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PDF rendering fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-wqy-zenhei
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify dependency lock policy
        run: python scripts/validate_dependency_locks.py
      - name: Audit locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --disable-pip --progress-spinner off --timeout 120 --vulnerability-service osv -r requirements-api.lock.txt
          python -m pip_audit --disable-pip --progress-spinner off --timeout 120 --vulnerability-service osv -r requirements.lock.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run full regression suite
        env:
          KAKA_STORAGE_BACKEND: json-file
          KAKA_STORAGE_SCOPE: process
          KAKA_OBJECT_STORAGE_BACKEND: local-filesystem
        run: python tests/run_tests.py
      - name: Validate contracts and state alignment
        shell: pwsh
        run: |
          ./scripts/validate-contracts.ps1 -Quiet
          ./scripts/check-state-alignment.ps1 -Quiet
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose definition
        run: |
          docker compose config --quiet
          docker compose \
            --env-file deploy/production/production.env.example \
            -f docker-compose.private-pilot.yml \
            -f docker-compose.production.yml \
            config --quiet
      - name: Build API image
        run: docker build --tag kaka-ci:${{ github.sha }} .
      - name: Start API container
        run: |
          docker run --detach --name kaka-ci-api \
            --publish 127.0.0.1:18000:8000 \
            --env KAKA_INTERNAL_API_TOKEN=ci-internal-token-not-secret \
            kaka-ci:${{ github.sha }}
      - name: Verify health and authenticated API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/openapi.json)" = "401"
          curl --fail --silent \
            --header 'Authorization: Bearer ci-internal-token-not-secret' \
            http://127.0.0.1:18000/openapi.json >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' kaka-ci-api)" = "kaka"
      - name: Show container logs on failure
        if: failure()
        run: docker logs kaka-ci-api || true
      - name: Stop container
        if: always()
        run: docker rm --force kaka-ci-api || true

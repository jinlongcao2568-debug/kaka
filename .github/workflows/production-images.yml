name: production-images

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character commit SHA to build
        required: true
        type: string
      release_version:
        description: Immutable release version tag
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-images-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  build:
    environment: production-images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        target:
          - api
          - worker
          - browser-worker
          - backup-tools
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 1
      - name: Validate immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.git_ref }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.release_version }}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{2,127}$ ]]
          [[ "$(git rev-parse HEAD)" == "${{ inputs.git_ref }}" ]]
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.target }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}/kaka-${{ matrix.target }}:${{ inputs.release_version }}
          cache-from: type=gha,scope=production-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.target }}
      - name: Record immutable image reference
        shell: bash
        run: |
          {
            echo "### ${{ matrix.target }}"
            echo
            echo '```text'
            echo "ghcr.io/${{ github.repository }}/kaka-${{ matrix.target }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "source_commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
